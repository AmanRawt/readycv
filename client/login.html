<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadyCV — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="auth-wrapper">
  <a href="index.html" class="auth-back">
    <span class="material-symbols-outlined">arrow_back</span> Back to Home
  </a>
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/images/logo.svg" alt="ReadyCVs Logo" onerror="this.style.display='none'">
      <h1 class="auth-brand">Ready<span class="cv-grad">CV</span></h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="showTab('login')">Log In</button>
      <button class="auth-tab" id="signupTab" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div class="auth-form" id="loginForm">
      <h2 class="form-title">Welcome back 👋</h2>
      <p class="form-sub">Log in to access your resumes</p>
      <div class="field-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          <span class="material-symbols-outlined eye-toggle" onclick="togglePwd('loginPassword',this)">visibility_off</span>
        </div>
      </div>
      <p class="forgot-link"><a href="forgot_password.html">Forgot password?</a></p>
      <div class="auth-error" id="loginError" style="display:none"></div>
      <button class="btn-auth" id="loginBtn" onclick="handleLogin()">
        <span class="material-symbols-outlined">login</span> Log In
      </button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.9 3 4 11.9 4 23s8.9 20 20 20c11 0 19.7-7.7 19.7-20 0-1.3-.1-2.7-.2-3z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- SIGNUP -->
    <div class="auth-form" id="signupForm" style="display:none">
      <h2 class="form-title">Create account ✨</h2>
      <p class="form-sub">Start building your perfect resume today</p>
      <div class="field-group">
        <label>Full Name</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">person</span>
          <input type="text" id="signupName" placeholder="Your full name" autocomplete="name">
        </div>
      </div>
      <div class="field-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="signupPassword" placeholder="Min. 6 characters" autocomplete="new-password">
          <span class="material-symbols-outlined eye-toggle" onclick="togglePwd('signupPassword',this)">visibility_off</span>
        </div>
      </div>
      <div class="auth-error" id="signupError" style="display:none"></div>
      <button class="btn-auth" id="signupBtn" onclick="handleSignup()">
        <span class="material-symbols-outlined">person_add</span> Create Account
      </button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.9 3 4 11.9 4 23s8.9 20 20 20c11 0 19.7-7.7 19.7-20 0-1.3-.1-2.7-.2-3z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>
</div>
<script src="js/core/particles.js"></script>
<script type="module">
  import { initializeApp }     from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
           signInWithPopup, GoogleAuthProvider, updateProfile, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  //Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCgK8JWEuilZmcMME9_LropW_2KUuQZItI",
    authDomain: "airesumebuilder-f732a.firebaseapp.com",
    projectId: "airesumebuilder-f732a",
    storageBucket: "airesumebuilder-f732a.firebasestorage.app",
    messagingSenderId: "431208769883",
    appId: "1:431208769883:web:53fe68f6e95d4f810c927e",
    measurementId: "G-CEW4HM1K2Z"
  };
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const gp   = new GoogleAuthProvider();

  // ── KEY FIX: only redirect to profile if NOT already on login page
  //    and only ONCE (use replace to prevent loop)
  let redirected = false;
  onAuthStateChanged(auth, user => {
    if (user && !redirected) {
      redirected = true;
      window.location.replace('profile.html'); // replace() prevents back-button loop
    }
  });

  function showErr(id, msg) {
    const el = document.getElementById(id+'Error');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
  }
  function hideErr(id) {
    const el = document.getElementById(id+'Error');
    if (el) el.style.display = 'none';
  }
  function setLoad(btnId, v) {
    const b = document.getElementById(btnId);
    if (b) { b.disabled = v; b.style.opacity = v ? '.6' : ''; }
  }

  window.handleLogin = async () => {
    const e = document.getElementById('loginEmail').value.trim();
    const p = document.getElementById('loginPassword').value;
    hideErr('login');
    if (!e || !p) return showErr('login','Please fill all fields');
    setLoad('loginBtn', true);
    try { await signInWithEmailAndPassword(auth, e, p); }
    catch(err) { showErr('login', friendly(err.code)); setLoad('loginBtn', false); }
  };

  window.handleSignup = async () => {
    const n = document.getElementById('signupName').value.trim();
    const e = document.getElementById('signupEmail').value.trim();
    const p = document.getElementById('signupPassword').value;
    hideErr('signup');
    if (!n||!e||!p) return showErr('signup','Please fill all fields');
    if (p.length < 6) return showErr('signup','Password must be at least 6 characters');
    setLoad('signupBtn', true);
    try {
      const c = await createUserWithEmailAndPassword(auth, e, p);
      await updateProfile(c.user, { displayName: n });
    } catch(err) { showErr('signup', friendly(err.code)); setLoad('signupBtn', false); }
  };

  window.handleGoogle = async () => {
    try { await signInWithPopup(auth, gp); }
    catch(err) { alert('Google sign-in failed: ' + err.message); }
  };

  window.handleForgotPassword = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      showErr('login', 'Please enter your email address first, then click Forgot Password.');
      return;
    }
    try {
      const { sendPasswordResetEmail } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
      await sendPasswordResetEmail(auth, email, {
  url: "https://readycv.in/reset.html"
});
      showErr('login', '✅ Password reset email sent! Check your inbox.');
      document.getElementById('loginError').style.background = 'rgba(163,230,53,.1)';
      document.getElementById('loginError').style.color = '#a3e635';
      document.getElementById('loginError').style.borderColor = 'rgba(163,230,53,.2)';
    } catch(e) {
      showErr('login', friendly(e.code) || 'Could not send reset email. Check your email address.');
    }
  };

  function friendly(code) {
    const m = {
      'auth/invalid-email':'Invalid email address.',
      'auth/user-not-found':'No account found with this email.',
      'auth/wrong-password':'Incorrect password.',
      'auth/invalid-credential':'Wrong email or password.',
      'auth/email-already-in-use':'This email is already registered.',
      'auth/weak-password':'Password is too weak (min 6 chars).',
      'auth/too-many-requests':'Too many attempts. Please wait.'
    };
    return m[code] || 'Something went wrong. Please try again.';
  }
</script>
<script>
function showTab(t) {
  document.getElementById('loginForm').style.display  = t==='login'  ? 'flex':'none';
  document.getElementById('signupForm').style.display = t==='signup' ? 'flex':'none';
  document.getElementById('loginTab').classList.toggle('active',  t==='login');
  document.getElementById('signupTab').classList.toggle('active', t==='signup');
}
function togglePwd(id, icon) {
  const el = document.getElementById(id);
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  icon.textContent = show ? 'visibility' : 'visibility_off';
}
</script>
</body>
</html>
