<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyCV - Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="login-container">
    <div class="form-card">
        <div class="form-header">
            <a href="index.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1.5rem;">
                <img src="assets/images/logo2.png" alt="ReadyCV" style="width:32px;height:32px;object-fit:contain;border-radius:7px;">
                <span style="font-size:1.1rem;font-weight:900;background:linear-gradient(135deg,#a855f7,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent;">ReadyCV</span>
            </a>
            <h1 class="main-title">Welcome Back</h1>
            <p class="subtitle">Your future starts now. Let's get you in. 🚀</p>
        </div>
        <form class="form-body" id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
                    <span class="material-symbols-outlined input-icon">mail</span>
                </div>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" autocomplete="current-password" required>
                    <span class="material-symbols-outlined password-toggle-icon" id="pwToggle">visibility_off</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p class="form-footer">
            Don't have an account? <a href="signup.html">Sign up — it's free</a>
        </p>
    </div>
</div>

<script src="js/core/particles.js"></script>
<script>
// Password toggle
const pwToggle = document.getElementById('pwToggle');
const pwInput  = document.getElementById('password');
if (pwToggle && pwInput) {
    pwToggle.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        pwToggle.textContent = show ? 'visibility' : 'visibility_off';
    });
}
</script>
<script type="module">
import { login } from "js/core/firebaseAuth.js";
import { saveUserData } from "js/core/firebase.js";
const form = document.getElementById('loginForm');
form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    await login(email, password);
    alert("Login Successful ✅");
    window.location.href = "index.html";
});
</script>

</body>
</html>
