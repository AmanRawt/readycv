<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyCVs - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="signup-container">
    <div class="form-card">
        <div class="form-header">
            <a href="index.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1.5rem;">
                <img src="assets/images/logo2.png" alt="ReadyCV" style="width:32px;height:32px;object-fit:contain;border-radius:7px;">
                <span style="font-size:1.1rem;font-weight:900;background:linear-gradient(135deg,#a855f7,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent;">ReadyCV</span>
            </a>
            <h1 class="main-title">Get Started</h1>
            <p class="subtitle">Create your free account. No credit card needed. 🎉</p>
        </div>

        <form class="form-body" id="signupForm">
            <div class="form-group">
                <input type="text" id="fullname" class="form-input" placeholder=" " autocomplete="name" required>
                <label for="fullname" class="form-label">Full Name</label>
            </div>
            <div class="form-group">
                <input type="email" id="email" class="form-input" placeholder=" " autocomplete="email" required>
                <label for="email" class="form-label">Email Address</label>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder=" " autocomplete="new-password" required>
                    <label for="password" class="form-label">Password</label>
                    <span class="material-symbols-outlined password-toggle-icon" id="pw1Toggle">visibility_off</span>
                </div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" class="form-input" placeholder=" " autocomplete="new-password" required>
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <span class="material-symbols-outlined password-toggle-icon" id="pw2Toggle">visibility_off</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <p class="form-footer">
            Already have an account? <a href="login_page.html">Log in</a>
        </p>
    </div>
</div>

<script src="js/core/particles.js"></script>
<script>
// Password toggles
function setupToggle(toggleId, inputId) {
    const toggle = document.getElementById(toggleId);
    const input  = document.getElementById(inputId);
    if (!toggle || !input) return;
    toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'visibility' : 'visibility_off';
    });
}
setupToggle('pw1Toggle', 'password');
setupToggle('pw2Toggle', 'confirm-password');
</script>
<script type="module">
import { signup } from "js/core/firebaseAuth.js";
import { saveUserData } from "js/core/firebase.js";
const form = document.getElementById('signupForm');
form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email    = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirm  = document.getElementById("confirm-password").value;
    if (password !== confirm) { alert("Passwords do not match ❌"); return; }
    await signup(email, password);
    alert("Account Created ✅");
    window.location.href = "login_page.html";
});
</script>

</body>
</html>
