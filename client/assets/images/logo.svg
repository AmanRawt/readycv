<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <!-- Document shape -->
  <rect x="8" y="4" width="28" height="36" rx="4" fill="url(#logoGrad)" opacity="0.15"/>
  <rect x="8" y="4" width="28" height="36" rx="4" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
  <!-- Lines representing resume content -->
  <rect x="13" y="12" width="18" height="2.5" rx="1.25" fill="url(#logoGrad)"/>
  <rect x="13" y="18" width="14" height="2" rx="1" fill="#a855f7" opacity="0.7"/>
  <rect x="13" y="23" width="18" height="2" rx="1" fill="#a855f7" opacity="0.5"/>
  <rect x="13" y="28" width="11" height="2" rx="1" fill="#a3e635" opacity="0.6"/>
  <!-- Check mark badge -->
  <circle cx="36" cy="36" r="9" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="1.5"/>
  <polyline points="31.5,36 34.5,39 40.5,33" stroke="#a3e635" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
